apiVersion: v1
kind: Service
metadata:
  name: nodejs-getting-started
  namespace: kairo-nodejs-getting-started
  labels:
    app: nodejs-getting-started
    app.kubernetes.io/managed-by: kairo
spec:
  # cluster-internal only: all outside traffic comes in through Traefik's
  # Ingress, so request metrics are always counted
  type: ClusterIP
  selector:
    app: nodejs-getting-started
  ports:
    - name: http
      port: 80
      targetPort: 3000

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-getting-started
  namespace: kairo-nodejs-getting-started
  labels:
    app: nodejs-getting-started
    app.kubernetes.io/managed-by: kairo
spec:
  # Traefik is the only way in. It answers on localhost:80, and the app's
  # public link (a Cloudflare tunnel) points at it with this Host header
  ingressClassName: traefik
  rules:
    - host: nodejs-getting-started.kairo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-getting-started
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-getting-started
  namespace: kairo-nodejs-getting-started
  labels:
    app: nodejs-getting-started
    app.kubernetes.io/managed-by: kairo
spec:
  replicas: 1
  # rollback needs old ReplicaSets to still be around
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: nodejs-getting-started
  template:
    metadata:
      labels:
        app: nodejs-getting-started
        app.kubernetes.io/managed-by: kairo
    spec:
      containers:
        - name: nodejs-getting-started
          image: kairo/nodejs-getting-started:d33649d5edae61fc766fe6d47e530c475c05a7a0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # liveness + memory limit are what make self-healing possible.
          # don't remove them without talking to BE 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
